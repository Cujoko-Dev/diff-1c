[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[project]
authors = [
    {name = "Cujoko", email = "cujoko@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "cjk-commons>=3.6.3,<4.0.0",
    "loguru>=0.6.0",
    "parse-1c-build>=5.15.2,<6.0.0",
]
description = "Diff utility for 1C:Enterprise"
dynamic = ["version"]
keywords = ["1c", "diff", "v8reader", "v8unpack", "gcomp"]
license = {text = "MIT"}
name = "diff-1c"
readme = "README.md"
requires-python = ">=3.6"

[project.scripts]
diff-1c = "diff_1c.__main__:run"

[project.urls]
repository = "https://github.com/cujoko-dev/diff-1c"

[tool.pdm.version]
path = "src/diff_1c/_version.py"
pattern = '^__version__\s*=\s*"([^"]+)"'
source = "file"
